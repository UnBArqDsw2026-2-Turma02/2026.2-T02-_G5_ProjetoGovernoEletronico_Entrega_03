<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Grupo 05 — Governo Eletrônico — Padrões de Projeto — Entrega 03">
  <title>G5 | Padrões de Projeto — Governo Eletrônico</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <header class="gov-header" aria-label="Identificação do projeto">
    <div class="gov-header__inner">
      <span class="gov-header__brand">Governo Federal</span>
      <span class="gov-header__project">Informa.BR | G5 — Padrões de Projeto · Entrega 03</span>
      <button class="theme-toggle" type="button" aria-pressed="false">Tema escuro</button>
    </div>
  </header>
  <div id="app">Carregando documentação...</div>
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    function setTheme(isDark) {
      document.body.classList.toggle('dark-theme', isDark);
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.textContent = isDark ? 'Tema claro' : 'Tema escuro';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    setTheme(localStorage.getItem('theme') === 'dark');
    themeToggle.addEventListener('click', () => setTheme(!document.body.classList.contains('dark-theme')));
    window.$docsify = {
      name: 'G5 — Padrões de Projeto',
      repo: 'https://github.com/UnBArqDsw2026-2-Turma02/2026.2-T02-_G5_ProjetoGovernoEletronico_Entrega_03',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: false,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
